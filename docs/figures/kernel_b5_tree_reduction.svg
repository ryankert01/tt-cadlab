<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="Tree reduction across the cores of one item: payloads over the NoC, per-round semaphore nibbles, softmax-correct merge">
<title>Tree reduction across the cores of one item: payloads over the NoC, per-round semaphore nibbles, softmax-correct merge</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
<text x="14" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2430">When one item spans several cores: the reduction tree</text>
<rect x="60" y="80" width="150" height="50" rx="5" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="135.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1f2430">core 0</text>
<text x="135.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="10.0" text-anchor="middle" font-weight="normal" fill="#5f6673">vid 3, root</text>
<rect x="250" y="80" width="150" height="50" rx="5" fill="#e8e8ee" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="325.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1f2430">core 1</text>
<text x="325.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="10.0" text-anchor="middle" font-weight="normal" fill="#5f6673">vid 2</text>
<rect x="440" y="80" width="150" height="50" rx="5" fill="#e8e8ee" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="515.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1f2430">core 2</text>
<text x="515.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="10.0" text-anchor="middle" font-weight="normal" fill="#5f6673">vid 1</text>
<rect x="630" y="80" width="150" height="50" rx="5" fill="#e8e8ee" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="705.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1f2430">core 3</text>
<text x="705.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="10.0" text-anchor="middle" font-weight="normal" fill="#5f6673">vid 0</text>
<text x="60" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">chunks are dealt backwards: core 0 (the root) owns the last ones, where the causal mask lands; core 3 the first. vid = N - 1 - core_num; a core with no chunk is skipped</text>
<path d="M 705,130 L 705,190 L 535,190 L 535,132" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="610.0" y="204" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5f6673">round 0: (l, m, O) -&gt; parent</text>
<path d="M 325,130 L 325,190 L 155,190 L 155,132" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="230.0" y="204" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5f6673">round 0</text>
<path d="M 495,130 L 495,230 L 115,230 L 115,132" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="325.0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5f6673">round 1: core 2&#x27;s merged (l, m, O) -&gt; root</text>
<rect x="60" y="270" width="400" height="150" rx="6" fill="#ffffff" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="70" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">Sender (child), in the writer kernel</text>
<text x="70" y="306" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">wait until compute has moved O, m, l into c_16, c_17, c_18</text>
<text x="70" y="321" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">NoC-write l, m, O into the parent&#x27;s c_19 at slot [round]</text>
<text x="70" y="336" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">(same L1 offset on every core, so the address is known)</text>
<text x="70" y="351" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">noc write barrier, then semaphore.up(parent, 1 &lt;&lt; (4 * round))</text>
<text x="70" y="366" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">pop c_16/17/18 and finish: a sender has nothing more to do</text>
<text x="70" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">semaphore value: nibble r (bits 4r..4r+3) counts round r&#x27;s arrivals</text>
<rect x="490" y="270" width="420" height="150" rx="6" fill="#ffffff" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="500" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">Receiver (parent), writer + compute</text>
<text x="500" y="306" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">writer: poll nibble[round] &gt;= 1, then L1-&gt;L1 copy the slot</text>
<text x="500" y="321" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">        into c_7 (l), c_6 (m), c_16 (O) and push them</text>
<text x="500" y="336" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">compute: correction_block merges child into local state:</text>
<text x="500" y="351" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">   m&#x27; = max(m, m_c);  a = exp((m - m&#x27;)s);  b = exp((m_c - m&#x27;)s)</text>
<text x="500" y="366" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">   l&#x27; = a l + b l_c;   O&#x27; = a O + b O_c</text>
<text x="500" y="381" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">root only: out = O / l -&gt; c_20 -&gt; DRAM</text>
<text x="500" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">one merge = the same correction the chunk loop applies, applied to another core&#x27;s state</text>
<text x="14" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. B5. ceil(log2 N) rounds for N cores per item; c_19 holds one (l, m, O) slot per round. The Palu group kernel gives each head its own slots and counts heads in the nibble.</text>
</svg>
