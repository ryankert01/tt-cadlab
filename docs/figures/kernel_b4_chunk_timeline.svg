<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-label="Pipelining across chunks: the reader stays one chunk ahead of compute; the writer frames the loop">
<title>Pipelining across chunks: the reader stays one chunk ahead of compute; the writer frames the loop</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="940" height="300" fill="#ffffff"/>
<text x="14" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2430">Timeline of one work item over its chunks</text>
<text x="112" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2430">reader</text>
<line x1="120" y1="90.0" x2="900" y2="90.0" stroke="#8e94a0" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="112" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2430">compute</text>
<line x1="120" y1="144.0" x2="900" y2="144.0" stroke="#8e94a0" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="112" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2430">writer</text>
<line x1="120" y1="198.0" x2="900" y2="198.0" stroke="#8e94a0" stroke-width="1.2" stroke-dasharray="2 3"/>
<rect x="130" y="75" width="50" height="30" rx="3" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="155.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">Q</text>
<rect x="182" y="75" width="100" height="30" rx="3" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="232.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">K0 V0</text>
<rect x="310" y="75" width="100" height="30" rx="3" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="360.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">K1 V1</text>
<rect x="438" y="75" width="100" height="30" rx="3" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="488.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">K2 V2</text>
<rect x="566" y="75" width="100" height="30" rx="3" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="616.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">K3 V3</text>
<rect x="694" y="75" width="40" height="30" rx="3" fill="#f4f4f4" stroke="#c2c6cc" stroke-width="1.2" opacity="1.0"/>
<text x="714.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">...</text>
<rect x="220" y="129" width="122" height="30" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="281.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">chunk 0</text>
<rect x="348" y="129" width="122" height="30" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="409.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">chunk 1</text>
<rect x="476" y="129" width="122" height="30" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="537.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">chunk 2</text>
<rect x="604" y="129" width="122" height="30" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="665.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">chunk 3</text>
<rect x="732" y="129" width="40" height="30" rx="3" fill="#f4f4f4" stroke="#c2c6cc" stroke-width="1.2" opacity="1.0"/>
<text x="752.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">...</text>
<rect x="130" y="183" width="86" height="30" rx="3" fill="#f7f2e4" stroke="#b08a3e" stroke-width="1.2" opacity="1.0"/>
<text x="173.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">mask, scalers</text>
<rect x="782" y="183" width="110" height="30" rx="3" fill="#e8e8ee" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="837.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">reduce, write</text>
<line x1="360" y1="112" x2="358" y2="122" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="3 3"/>
<text x="420" y="119" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">K1/V1 must be in c_1/c_2 before chunk 1 starts; the CBs hold two chunks, so the reader is at most one ahead</text>
<text x="120" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">Stock at 4k, batch 32: about 44 us of compute per chunk per item against 136 KB of K+V per chunk. The stock op reaches 77 % of the</text>
<text x="120" y="254" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">bandwidth the chip can deliver in this position, i.e. the reader lane and the compute lane are close to the same length: it is near DRAM-bound.</text>
<text x="120" y="268" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">The fused Palu kernel reads fewer bytes per chunk but its compute lane is longer (Fig. C6), so the reader waits on compute instead.</text>
<text x="14" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. B4. Whichever lane is longer sets the pace; double buffering hides the other lane only up to one chunk.</text>
</svg>
