<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="Stage 2: what the fused op replaces and what happens inside it per chunk of 512 positions">
<title>Stage 2: what the fused op replaces and what happens inside it per chunk of 512 positions</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
<text x="14" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2430">Stage 2, the fused kernel: K is rebuilt chunk by chunk inside the attention op and never leaves L1</text>
<text x="30" y="62" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#5f6673">stage 1</text>
<rect x="100" y="48" width="130" height="40" rx="5" fill="#fde7d6" stroke="#e07b39" stroke-width="1.2" opacity="1.0"/>
<text x="165.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">h_k cache</text>
<text x="165.0" y="80.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">S x r_k</text>
<line x1="230" y1="68" x2="250" y2="68" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="250" y="48" width="130" height="40" rx="5" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="315.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">matmul</text>
<text x="315.0" y="80.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">S x 128 bf16</text>
<line x1="380" y1="68" x2="400" y2="68" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="400" y="48" width="130" height="40" rx="5" fill="#ece4fb" stroke="#8b5cf6" stroke-width="1.2" opacity="1.0"/>
<text x="465.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">RoPE</text>
<text x="465.0" y="80.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">S x 128</text>
<line x1="530" y1="68" x2="550" y2="68" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="550" y="48" width="130" height="40" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="615.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">typecast</text>
<text x="615.0" y="80.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">S x 128 bfp8</text>
<line x1="680" y1="68" x2="700" y2="68" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="700" y="48" width="130" height="40" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="765.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">SDPA decode</text>
<text x="765.0" y="80.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">MLA op</text>
<text x="100" y="106" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#d64545">three full-size K tensors (S x 128) in DRAM per layer per step; 207 ms of a 265 ms step at 4k</text>
<text x="30" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#e07b39">stage 2</text>
<rect x="100" y="114" width="130" height="40" rx="5" fill="#fde7d6" stroke="#e07b39" stroke-width="1.2" opacity="1.0"/>
<text x="165.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">h_k cache</text>
<text x="165.0" y="146.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">S x r_k</text>
<line x1="230" y1="134" x2="250" y2="134" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="250" y="114" width="330" height="40" rx="5" fill="#fde7d6" stroke="#e07b39" stroke-width="1.2" opacity="1.0"/>
<text x="415.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">ttnn.transformer.palu_sdpa_decode</text>
<text x="415.0" y="146.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">q, h_k, w_rot, cos/sin table, h_v, r_v, cur_pos</text>
<line x1="580" y1="134" x2="600" y2="134" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="600" y="114" width="130" height="40" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="665.0" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">[1,32,16,r_v]</text>
<text x="665.0" y="146.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">same tail as stage 1</text>
<text x="100" y="172" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#3c9d6b">no reconstruction tensors: K exists only as one 512-row chunk in the core&#x27;s L1; 65 ms per step at 4k (55 with the stage 2e kernel)</text>
<rect x="30" y="176" width="880" height="250" rx="8" fill="#ffffff" stroke="#e07b39" stroke-width="1.4" opacity="1.0"/>
<text x="44" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1f2430">inside one Tensix core, per chunk of 512 positions (16 K row tiles; the op is a copy of flash decode with six borrowed CB slots)</text>
<rect x="44" y="216" width="150" height="46" rx="5" fill="#fde7d6" stroke="#e07b39" stroke-width="1.2" opacity="1.0"/>
<text x="119.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">latent chunk</text>
<text x="119.0" y="251.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">512 x r_k bfp8, 17 KB</text>
<rect x="44" y="272" width="150" height="46" rx="5" fill="#fde7d6" stroke="#e07b39" stroke-width="1.2" opacity="1.0"/>
<text x="119.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">w_rot resident</text>
<text x="119.0" y="307.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">[u_k | u_k T]  r_k x 256</text>
<rect x="44" y="328" width="150" height="46" rx="5" fill="#f7f2e4" stroke="#b08a3e" stroke-width="1.2" opacity="1.0"/>
<text x="119.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">angle rows 0..511</text>
<text x="119.0" y="363.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">cos | sin, read once per column</text>
<line x1="194" y1="239" x2="230" y2="239" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="194" y1="295" x2="230" y2="266" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="194" y1="351" x2="230" y2="294" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="230" y="216" width="250" height="92" rx="6" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="355" y="236" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">rebuild one K row tile</text>
<text x="240" y="254" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#1f2430">AB = lat_i . [u_k | u_k T]      (matmul)</text>
<text x="240" y="267" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#1f2430">K_rot = A . cos + B . sin        (rotation)</text>
<text x="240" y="280" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#1f2430">packed into c_1 in flash decode&#x27;s K order</text>
<line x1="480" y1="262" x2="516" y2="262" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="516" y="216" width="200" height="92" rx="6" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="616" y="236" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">flash-decode step, unchanged</text>
<text x="526" y="254" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#1f2430">scores = q~ . K_rot^T</text>
<text x="526" y="267" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#1f2430">online softmax (m, l, O)</text>
<text x="526" y="280" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#1f2430">O += P . V   (V = h_v latent)</text>
<rect x="740" y="216" width="160" height="92" rx="6" fill="#f4f4f4" stroke="#c2c6cc" stroke-width="1.2" opacity="1.0"/>
<text x="820" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">next chunk</text>
<text x="748" y="256" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">16 chunks at 8k, 2 at 1k;</text>
<text x="748" y="269" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">the root core owns the last</text>
<text x="748" y="282" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">chunks (the causal mask)</text>
<rect x="230" y="320" width="486" height="66" rx="6" fill="#ece4fb" stroke="#8b5cf6" stroke-width="1.2" opacity="1.0"/>
<text x="240" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="bold" fill="#1f2430">Phase 2 (the shipped variant): relative rotation</text>
<text x="240" y="354" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2430">q R_p . (k R_{s0+t})^T = (q R_{p-s0}) . (k R_t)^T</text>
<text x="240" y="367" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2430">K only ever needs angles 0..511 (resident); the query state q~ is advanced</text>
<text x="240" y="380" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="start" font-weight="normal" fill="#1f2430">by R_{-512} once per chunk (8 fp32 tiles) instead of streaming a 256 KB table</text>
<text x="740" y="326" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#5f6673">DRAM bytes per chunk:</text>
<text x="740" y="339" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#5f6673">baseline 136 KB (K + V)</text>
<text x="740" y="352" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#5f6673">fused 17 KB latent</text>
<text x="740" y="365" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.8" text-anchor="start" font-weight="normal" fill="#5f6673">  + 68 KB V (r_v 128)</text>
<text x="44" y="402" font-family="Helvetica, Arial, sans-serif" font-size="9.8" text-anchor="start" font-weight="normal" fill="#5f6673">stage 2e made the rebuild cheaper (matmul straight into DST, dest-reuse multiplies; the angle table multicast down each grid column) and it is the default kernel today.</text>
<text x="14" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. R3. Same caches, same front and tail of the layer as stage 1; only the dashed block of Fig. R2 changes, into a per-chunk rebuild inside the op.</text>
</svg>
