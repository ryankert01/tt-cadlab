<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="The DST register and one compute round trip: acquire, math, commit, wait, pack, release">
<title>The DST register and one compute round trip: acquire, math, commit, wait, pack, release</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
<text x="14" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2430">DST and the compute round trip</text>
<text x="102" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2430">TRISC 0 unpack</text>
<line x1="110" y1="82.0" x2="910" y2="82.0" stroke="#8e94a0" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="102" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2430">TRISC 1 math</text>
<line x1="110" y1="136.0" x2="910" y2="136.0" stroke="#8e94a0" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="102" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2430">TRISC 2 pack</text>
<line x1="110" y1="190.0" x2="910" y2="190.0" stroke="#8e94a0" stroke-width="1.2" stroke-dasharray="2 3"/>
<rect x="120" y="66" width="140" height="32" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="190.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">unpack tiles -&gt; SrcA / SrcB</text>
<rect x="140" y="120" width="60" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="170.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">acquire</text>
<rect x="202" y="120" width="158" height="32" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="281.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">FPU / SFPU ops into DST half A</text>
<rect x="362" y="120" width="48" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="386.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">commit</text>
<rect x="362" y="174" width="78" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="401.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">wait</text>
<rect x="442" y="174" width="138" height="32" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="511.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">pack_tile x k  (DST -&gt; L1)</text>
<rect x="582" y="174" width="48" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="606.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">release</text>
<rect x="370" y="66" width="140" height="32" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="440.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">unpack next tiles</text>
<rect x="430" y="120" width="60" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="460.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">acquire</text>
<rect x="492" y="120" width="158" height="32" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="571.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">ops into DST half B</text>
<rect x="652" y="120" width="48" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="676.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">commit</text>
<rect x="652" y="174" width="78" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="691.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">wait</text>
<rect x="732" y="174" width="138" height="32" rx="3" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="801.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">pack_tile x k</text>
<rect x="872" y="174" width="38" height="32" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="891.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1f2430">rel.</text>
<line x1="140" y1="228" x2="630" y2="228" stroke="#5f6673" stroke-width="1"/>
<line x1="140" y1="228" x2="140" y2="224" stroke="#5f6673" stroke-width="1"/>
<line x1="630" y1="228" x2="630" y2="224" stroke="#5f6673" stroke-width="1"/>
<text x="385.0" y="241" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5f6673">one DST round trip: tile_regs_acquire .. tile_regs_release (a full three-thread handshake)</text>
<text x="120" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">Half-sync: math fills one half of DST while pack drains the other, so consecutive round trips overlap.</text>
<text x="120" y="278" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">But the work inside one acquisition is bounded by the half&#x27;s capacity, and every acquisition costs the handshake.</text>
<rect x="40" y="290" width="400" height="120" rx="6" fill="#ffffff" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="50" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">DST capacity per acquisition (dest_helpers.hpp)</text>
<text x="52" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="bold" fill="#5f6673"></text>
<text x="172" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="bold" fill="#5f6673">16-bit dest</text>
<text x="292" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="bold" fill="#5f6673">fp32 dest</text>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="bold" fill="#5f6673">full sync</text>
<text x="172" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">16 tiles</text>
<text x="292" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">8 tiles</text>
<text x="52" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="bold" fill="#5f6673">half sync (default)</text>
<text x="172" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">8 tiles</text>
<text x="292" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">4 tiles</text>
<rect x="286" y="356" width="64" height="18" rx="3" fill="#fbe1e1" stroke="#d64545" stroke-width="1.2" opacity="0.6"/>
<text x="52" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">This study runs fp32 dest accumulate, half sync: dst_size = 4 tiles in both kernels.</text>
<rect x="470" y="290" width="440" height="120" rx="6" fill="#ffffff" stroke="#8e94a0" stroke-width="1.2" opacity="1.0"/>
<text x="480" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">Two engines write DST</text>
<rect x="480" y="318" width="14" height="11" rx="2" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="500" y="328" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">FPU (matrix): SrcA x SrcB -&gt; DST. 8x16 by 16x16 per cycle; matmul_block,</text>
<text x="500" y="341" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">mul_tiles, add_tiles, reduce. Operands come straight from CBs via the unpacker.</text>
<rect x="480" y="356" width="14" height="11" rx="2" fill="#ece4fb" stroke="#8b5cf6" stroke-width="1.2" opacity="1.0"/>
<text x="500" y="366" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">SFPU (vector): 32 lanes, fp32, reads and writes DST in place; 32 passes per</text>
<text x="500" y="379" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">full tile. exp_tile, recip_tile, add_binary_tile. Input must already be in DST.</text>
<text x="480" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">Both are issued by TRISC 1; results leave DST only through the packer.</text>
<rect x="40" y="430" width="870" height="96" rx="6" fill="#ffffff" stroke="#8e94a0" stroke-width="1.2" opacity="1.0" stroke-dasharray="4 3"/>
<text x="52" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">Three more things every op in the kernels does, and that show up as cost</text>
<text x="52" y="468" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">reconfig_data_format(cbA, cbB) / pack_reconfig_data_format(cb): tell the unpacker and packer the tile format of the CBs about to be touched (bf16, bfp8, fp32).</text>
<text x="52" y="483" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">&lt;op&gt;_init(...): program the engine for the next kind of op (matmul_block_init, mul_init, add_binary_tile_init, exp_tile_init). Switching op types costs an init.</text>
<text x="52" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">fp32 dest accumulate: DST holds fp32 so a matmul&#x27;s inner sum does not round to bf16; the price is half the DST tiles per acquisition (8 -&gt; 4).</text>
<text x="14" y="550" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. A4. A compute kernel is a sequence of DST acquisitions; each one does at most dst_size tiles of output and costs a three-thread handshake. Fewer, fuller acquisitions win.</text>
</svg>
