<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-label="Circular buffers: the producer/consumer queues in L1 that connect the three kernels">
<title>Circular buffers: the producer/consumer queues in L1 that connect the three kernels</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
<text x="14" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2430">Circular buffers (CBs): how the three kernels hand tiles to each other</text>
<text x="60" y="58" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673">one CB = a fixed L1 region of N pages (here 8 tiles), used as a FIFO</text>
<rect x="60" y="70" width="52" height="40" rx="2" fill="#eef2f7" stroke="#6b7a99" stroke-width="1.2" opacity="1.0"/>
<text x="86.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 0</text>
<rect x="114" y="70" width="52" height="40" rx="2" fill="#eef2f7" stroke="#6b7a99" stroke-width="1.2" opacity="1.0"/>
<text x="140.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 1</text>
<rect x="168" y="70" width="52" height="40" rx="2" fill="#f7f2e4" stroke="#b08a3e" stroke-width="1.2" opacity="1.0"/>
<text x="194.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 2</text>
<rect x="222" y="70" width="52" height="40" rx="2" fill="#f7f2e4" stroke="#b08a3e" stroke-width="1.2" opacity="1.0"/>
<text x="248.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 3</text>
<rect x="276" y="70" width="52" height="40" rx="2" fill="#f7f2e4" stroke="#b08a3e" stroke-width="1.2" opacity="1.0"/>
<text x="302.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 4</text>
<rect x="330" y="70" width="52" height="40" rx="2" fill="#f4f4f4" stroke="#c2c6cc" stroke-width="1.2" opacity="1.0"/>
<text x="356.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 5</text>
<rect x="384" y="70" width="52" height="40" rx="2" fill="#f4f4f4" stroke="#c2c6cc" stroke-width="1.2" opacity="1.0"/>
<text x="410.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 6</text>
<rect x="438" y="70" width="52" height="40" rx="2" fill="#f4f4f4" stroke="#c2c6cc" stroke-width="1.2" opacity="1.0"/>
<text x="464.0" y="94.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1f2430">tile 7</text>
<line x1="194.0" y1="144" x2="194.0" y2="114" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="194.0" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5f6673">read pointer (front)</text>
<line x1="356.0" y1="40" x2="356.0" y2="68" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="356.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#5f6673">write pointer (back)</text>
<line x1="168" y1="172" x2="328" y2="172" stroke="#5f6673" stroke-width="1"/>
<line x1="168" y1="172" x2="168" y2="168" stroke="#5f6673" stroke-width="1"/>
<line x1="328" y1="172" x2="328" y2="168" stroke="#5f6673" stroke-width="1"/>
<text x="248.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5f6673">3 tiles produced and not yet consumed</text>
<text x="500" y="86" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">pointers wrap</text>
<text x="500" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">around the end</text>
<rect x="60" y="200" width="380" height="88" rx="6" fill="#ffffff" stroke="#b08a3e" stroke-width="1.2" opacity="1.0"/>
<text x="70" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">producer side (reader kernel, or the packer inside compute)</text>
<text x="70" y="238" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">cb_reserve_back(cb, n)   block until n pages are free</text>
<text x="70" y="253" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">write n pages at get_write_ptr()   (NoC read into L1, or pack_tile)</text>
<text x="70" y="268" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">cb_push_back(cb, n)      publish them: the consumer may now see them</text>
<rect x="480" y="200" width="400" height="88" rx="6" fill="#ffffff" stroke="#b08a3e" stroke-width="1.2" opacity="1.0"/>
<text x="490" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">consumer side (compute&#x27;s unpacker, or the writer kernel)</text>
<text x="490" y="238" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">cb_wait_front(cb, n)     block until n pages are ready</text>
<text x="490" y="253" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">read them: tile index i = i pages past the front (no wrap!)</text>
<text x="490" y="268" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">cb_pop_front(cb, n)      free them for the producer</text>
<rect x="60" y="320" width="140" height="40" rx="5" fill="#e8e8ee" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="130.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">reader</text>
<text x="130.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">BRISC, NoC 0</text>
<rect x="380" y="320" width="160" height="40" rx="5" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="460.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">compute</text>
<text x="460.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">unpack / math / pack</text>
<rect x="740" y="320" width="140" height="40" rx="5" fill="#e8e8ee" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="810.0" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">writer</text>
<text x="810.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">NCRISC, NoC 1</text>
<line x1="200" y1="340" x2="380" y2="340" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="290.0" y="333.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6673">inputs, c_0 .. c_15 by convention</text>
<line x1="540" y1="340" x2="740" y2="340" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="640.0" y="333.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6673">outputs, c_16 .. c_20</text>
<path d="M 470,360 L 470,382 L 455,382" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="480" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">intermediates c_21 .. c_31: compute produces and consumes them itself</text>
<path d="M 810,320 L 810,302 L 600,302 L 600,324" fill="none" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="3 3"/>
<text x="690" y="296" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">the writer also produces inputs (mask, scalers)</text>
<text x="14" y="430" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. A3. A CB is a fixed L1 region with a read and a write pointer; every kernel blocks on the other side&#x27;s progress, which is the only synchronisation inside a core.</text>
</svg>
