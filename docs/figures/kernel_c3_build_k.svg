<text x="370" y="104" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">2 DST round trips: 4 output tiles each (dst_size = 4), inner dim Rt</text>
<text x="370" y="116" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">matmul_block_init + reconfig before, pack_tile x 4 after, per trip</text>
<rect x="40" y="140" width="870" height="150" rx="6" fill="#ffffff" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="52" y="160" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1f2430">then for each column tile j = 0..3: one DST round trip</text>
<text x="52" y="182" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">tile_regs_acquire()</text>
<text x="52" y="198" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">mul_tiles(A_j,  cos[i, j])  -&gt; dst 0        (FPU)</text>
<text x="52" y="214" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">mul_tiles(B_j,  sin[i, j])  -&gt; dst 1        (FPU)</text>
<text x="52" y="230" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">add_binary_tile(dst 0, dst 1 -&gt; dst 0)     (SFPU: a full-tile vector pass)</text>
<text x="52" y="246" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">tile_regs_commit(); tile_regs_wait(); pack_tile(dst 0 -&gt; c_1 at index j * Sk_chunk_t + i); tile_regs_release()</text>
<text x="52" y="278" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">cos/sin tiles come from c_13 (row i of the table for Phase 1; row i mod c, i.e. always rows 0..15, for Phase 2). mul_init + add_binary_tile_init run once per row tile.</text>
<text x="40" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#1f2430">K_rot chunk in c_1, column-major tile order = what the stock Q K^T matmul reads</text>
