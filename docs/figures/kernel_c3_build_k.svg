<text x="372" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1f2430">What this costs per chunk of 512 positions (16 row tiles), r_k = 32</text>
<text x="372" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#5f6673"></text>
<text x="502" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#5f6673">stock</text>
<text x="672" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#5f6673">fused (K rebuild only)</text>
<line x1="368" y1="357" x2="900" y2="357" stroke="#8e94a0" stroke-width="1.2"/>
<text x="372" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">DST round trips</text>
<text x="502" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">~24 for the whole flash step</text>
<text x="672" y="371" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">6 x 16 = 96, before the flash step</text>
<text x="372" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">engine inits</text>
<text x="502" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">a handful</text>
<text x="672" y="390" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">3 x 16 = 48 (matmul, mul, add)</text>
<text x="372" y="409" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">format reconfigs</text>
<text x="502" y="409" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">~10</text>
<text x="672" y="409" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">4 x 16 = 64</text>
<text x="372" y="428" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">SFPU passes</text>
<text x="502" y="428" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">exp on 16 score tiles</text>
<text x="672" y="428" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">+ 64 full-tile adds</text>
<text x="372" y="447" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">FPU work</text>
<text x="502" y="447" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">QK (64 tile-mults), PV (64)</text>
<text x="672" y="447" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">+ AB matmul 128 tile-mults + 128 eltwise muls</text>
<text x="372" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">DRAM bytes</text>
<text x="502" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">136 KB (K + V)</text>
<text x="672" y="466" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#1f2430">17 KB latent + 68 KB V (r_v 128)</text>
<text x="372" y="490" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">measured: the rebuild adds ~0.8 us per row tile of which ~0.28 us is the matmul (stage 2d)</text>
<text x="14" y="570" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. C3. The rebuild is cheap in bytes and FLOPs and expensive in round trips: it adds ~100 small DST acquisitions per chunk to a flash step that needs ~24.</text>
</svg>
