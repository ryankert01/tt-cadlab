<text x="48.0" y="400.88" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="8" text-anchor="middle" font-weight="normal" fill="#1f2430">...</text>
<rect x="58" y="390" width="16" height="16" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
<rect x="76" y="390" width="16" height="16" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
<rect x="94" y="390" width="16" height="16" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
<text x="120" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">P V: 1 x 4 tiles into c_25</text>
<text x="120" y="354" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">accumulated into O in c_26</text>
<rect x="458" y="46" width="460" height="380" rx="6" fill="#ffffff" stroke="#8e94a0" stroke-width="1.2" opacity="1.0"/>
<text x="470" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2430">Online softmax, per chunk (flash decode)</text>
<text x="470" y="94" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">state per item:  m (running row max), l (running row sum), O (1 x 4 tiles)</text>
<text x="470" y="111" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430"></text>
<text x="470" y="128" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">S      = Q K_k^T                                  (QK matmul, transpose=true)</text>
<text x="470" y="145" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">S     += mask         only on the last chunk, positions &gt; cur_pos -&gt; -inf</text>
<text x="470" y="162" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">m_new  = max(m, rowmax(S))                        (reduce_c MAX)</text>
<text x="470" y="179" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">P      = exp((S - m_new) * scale)                 (sub_exp, scale folded in)</text>
<text x="470" y="196" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">r      = rowsum(P)                                (reduce_c SUM over the 16 tiles)</text>
<text x="470" y="213" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">a      = exp((m - m_new) * scale)                 (the correction factor)</text>
<text x="470" y="230" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">l      = a * l + r</text>
<text x="470" y="247" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">O      = a * O + P V_k                            (PV matmul, then rescale + add)</text>
<text x="470" y="264" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">m      = m_new</text>
<text x="470" y="281" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430"></text>
<text x="470" y="298" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">after the last chunk (or after merging other cores):  out = O / l</text>
<text x="470" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">Why chunks: the whole K/V for one item at 8k is 2 x 8192 x 128 bfp8 = 2.2 MB,</text>
<text x="470" y="347" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">more than L1. A 512-position chunk of K and V is 2 x 68 KB and is double-</text>
<text x="470" y="362" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">buffered, so the reader can fetch chunk k+1 while compute works on chunk k.</text>
<text x="470" y="377" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673"></text>
<text x="470" y="392" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">Why &#x27;online&#x27;: m and l let each chunk&#x27;s softmax be normalised later, so the</text>
<text x="470" y="407" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">chunks (and cores) can be combined in any order with the same a-factors.</text>
<text x="14" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. B1. One item = one batch row x one KV head; its 16 query heads share the tile&#x27;s rows, so a single 1 x 4-tile Q does all of them at once.</text>
</svg>
