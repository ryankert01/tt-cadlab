<rect x="588" y="368" width="16" height="16" fill="#fde7d6" stroke="#e07b39" stroke-width="0.8"/>
<rect x="606" y="368" width="16" height="16" fill="#fde7d6" stroke="#e07b39" stroke-width="0.8"/>
<rect x="624" y="368" width="16" height="16" fill="#fde7d6" stroke="#e07b39" stroke-width="0.8"/>
<text x="570" y="398" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">u_v: r_v x 128</text>
<text x="570" y="410" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">(in the c_4 block)</text>
