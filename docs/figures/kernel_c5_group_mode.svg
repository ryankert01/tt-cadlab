<rect x="518" y="404" width="16" height="16" fill="#fde7d6" stroke="#e07b39" stroke-width="0.8"/>
<text x="500" y="434" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">V latent chunk</text>
<text x="500" y="446" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">512 x r_v (c_2)</text>
<text x="550" y="386" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2430">x</text>
<rect x="570" y="350" width="16" height="16" fill="#fde7d6" stroke="#e07b39" stroke-width="0.8"/>
<rect x="588" y="350" width="16" height="16" fill="#fde7d6" stroke="#e07b39" stroke-width="0.8"/>
