<text x="698.0" y="414.52" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="7" text-anchor="middle" font-weight="normal" fill="#1f2430">...</text>
<rect x="708" y="404" width="16" height="16" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
<rect x="726" y="404" width="16" height="16" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
