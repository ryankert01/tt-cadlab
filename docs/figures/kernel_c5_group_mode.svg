<text x="690" y="434" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">V_h: 512 x 128 into c_1,</text>
<text x="690" y="446" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">row-major, for the PV matmul</text>
<text x="492" y="470" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">one matmul per row tile (inner dim Rvt, 4 output tiles = 1 trip); needed because a</text>
<text x="492" y="482" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">group&#x27;s u_v cannot be folded into wo without making wo 4x wider.</text>
<text x="492" y="496" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">Group mode&#x27;s merge uses unfused primitives (Fig. B5 note); split capped at 4 cores.</text>
<text x="14" y="550" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. C5. Group mode changes the loop nesting and the CB bookkeeping, not the per-head math: head h&#x27;s chunk and accumulation order are unchanged (bit-identical when no child is merged).</text>
</svg>
