<rect x="88" y="102" width="14" height="14" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
<rect x="40" y="118" width="14" height="14" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
<rect x="56" y="118" width="14" height="14" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="0.8"/>
