<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="What Palu changes in the data the decode kernel reads: a narrow latent plus per-head weights instead of the full K cache">
<title>What Palu changes in the data the decode kernel reads: a narrow latent plus per-head weights instead of the full K cache</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2430"/></marker></defs>
