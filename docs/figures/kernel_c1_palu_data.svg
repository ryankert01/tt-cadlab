<text x="14" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2430">Stock K cache vs Palu K latent, per (batch row, KV head)</text>
<text x="40" y="60" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1f2430">stock: K cache S x 128, bfp8</text>
