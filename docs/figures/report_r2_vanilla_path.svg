<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="Stage 1 on the n300: the ttnn ops of one decode step in one layer, and the reconstruction block that dominates it">
<title>Stage 1 on the n300: the ttnn ops of one decode step in one layer, and the reconstruction block that dominates it</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2430"/></marker></defs>
<rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
<text x="14" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2430">Stage 1, the vanilla path: existing ttnn ops only, K rebuilt over the whole window every step</text>
<text x="14" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#5f6673">per chip (tensor-parallel 2): 16 query heads, 4 KV heads, head_dim 128, batch 32; caches [32, 4, max_seq, r] in bfp8</text>
<rect x="30" y="70" width="150" height="44" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="105.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">ttnn.linear</text>
<text x="105.0" y="104.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">x . [W_q | VT_k^T | VT_v^T]</text>
<line x1="180" y1="92" x2="194" y2="92" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="194" y="70" width="236" height="44" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="312.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">nlp_create_qkv_heads_decode</text>
<text x="312.0" y="104.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">q [1,32,16,128]  h_k [32,4,1,r_k]  h_v [32,4,1,r_v]</text>
<line x1="430" y1="92" x2="444" y2="92" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="444" y="70" width="150" height="44" rx="5" fill="#ece4fb" stroke="#8b5cf6" stroke-width="1.2" opacity="1.0"/>
<text x="519.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">rotary_embedding_llama</text>
<text x="519.0" y="104.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">q only, decode mode</text>
<line x1="594" y1="92" x2="608" y2="92" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="608" y="70" width="236" height="44" rx="5" fill="#fde7d6" stroke="#e07b39" stroke-width="1.2" opacity="1.0"/>
<text x="726.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">paged_update_cache x2</text>
<text x="726.0" y="104.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">h_k -&gt; K-latent cache, h_v -&gt; V-latent cache</text>
<rect x="30" y="150" width="880" height="150" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.6" opacity="1.0" stroke-dasharray="6 4"/>
<text x="44" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#d64545">K reconstruction, every step, over the live window S = max(current_pos) + 1 (rounded up to 256)</text>
<rect x="44" y="186" width="150" height="84" rx="5" fill="#fde7d6" stroke="#e07b39" stroke-width="1.2" opacity="1.0"/>
<text x="119.0" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">slice</text>
<text x="119.0" y="224" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">h_k[:, :, :S]  [32,4,S,r_k]</text>
<line x1="194" y1="228" x2="214" y2="228" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="214" y="186" width="200" height="84" rx="5" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="314.0" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">ttnn.matmul</text>
<text x="314.0" y="224" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">h_k . U_k^T  (bf16, HiFi2)</text>
<text x="314.0" y="238" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">[32,4,S,128]  268 MB at 8k</text>
<line x1="414" y1="228" x2="434" y2="228" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="434" y="186" width="220" height="84" rx="5" fill="#ece4fb" stroke="#8b5cf6" stroke-width="1.2" opacity="1.0"/>
<text x="544.0" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">rotary_embedding_llama</text>
<text x="544.0" y="224" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">prefill mode over positions 0..S-1</text>
<text x="544.0" y="238" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">[32,4,S,128]  268 MB</text>
<line x1="654" y1="228" x2="674" y2="228" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="674" y="186" width="200" height="84" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="774.0" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1f2430">ttnn.typecast</text>
<text x="774.0" y="224" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">bf16 -&gt; bfp8 (as a stock K cache)</text>
<text x="774.0" y="238" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#5f6673">K_att  143 MB</text>
<text x="44" y="288" font-family="Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">three fresh tensors per layer per step, freed as soon as the next consumes them; nothing is reused across steps (ttnn ops return new tensors)</text>
<rect x="30" y="330" width="330" height="44" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="195.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">flash_multi_latent_attention_decode</text>
<text x="195.0" y="364.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">q, K_att, V = h_v cache, head_dim_v = r_v  -&gt;  [1,32,16,r_v]</text>
<line x1="360" y1="352" x2="380" y2="352" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="380" y="330" width="180" height="44" rx="5" fill="#dbe7fb" stroke="#2f6fdb" stroke-width="1.2" opacity="1.0"/>
<text x="470.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">nlp_concat_heads_decode</text>
<text x="470.0" y="364.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">pad to 128 if r_v &lt; 128</text>
<line x1="560" y1="352" x2="580" y2="352" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="580" y="330" width="170" height="44" rx="5" fill="#dff3e6" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="665.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">ttnn.linear</text>
<text x="665.0" y="364.0" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">wo_fused = U_v W_o (absorbed V)</text>
<line x1="750" y1="352" x2="770" y2="352" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="770" y="330" width="140" height="44" rx="5" fill="#e8e8ee" stroke="#6b6f8a" stroke-width="1.2" opacity="1.0"/>
<text x="840.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1f2430">all-reduce</text>
<text x="840.0" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" text-anchor="middle" font-weight="normal" fill="#5f6673">tensor-parallel 2</text>
<line x1="880" y1="114" x2="880" y2="148" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="872" y="140" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="end" font-weight="normal" fill="#5f6673">latent caches</text>
<line x1="330" y1="300" x2="330" y2="328" stroke="#1f2430" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="338" y="318" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" text-anchor="start" font-weight="normal" fill="#5f6673">K_att</text>
<rect x="30" y="400" width="430" height="150" rx="6" fill="#ffffff" stroke="#d64545" stroke-width="1.2" opacity="1.0"/>
<text x="42" y="420" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1f2430">what it costs (batch 32, context 4k, per decode step; stage 2d profile)</text>
<text x="42" y="442" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">stock decode step                      55 ms</text>
<text x="42" y="458" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">Palu step, ratio 0.5, this path       265 ms   (0.21x stock)</text>
<text x="42" y="474" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">  of which reconstruction             207 ms   matmul 91 + RoPE 80 + typecast 33</text>
<text x="42" y="490" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">  the attention op itself               8 ms</text>
<text x="42" y="506" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1f2430">cost is linear in S and set by the 128-wide output, not by r_k</text>
<text x="42" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">V-only rows (r_k = 128) skip the block entirely and decode at stock speed:</text>
<text x="42" y="541" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">38.8 vs 38.1 ms at 1k, and they run at 8k where stock does not allocate.</text>
<rect x="480" y="400" width="430" height="150" rx="6" fill="#ffffff" stroke="#3c9d6b" stroke-width="1.2" opacity="1.0"/>
<text x="492" y="420" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1f2430">prefill (once per request) and the fast paths</text>
<text x="492" y="442" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">prefill: rebuild K and V in full (h . U^T), RoPE on q and K,</text>
<text x="492" y="456" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">  stock scaled_dot_product_attention, then fill_cache(latents only)</text>
<text x="492" y="470" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">  -&gt; compute-bound; TTFT unchanged (440-448 ms at 2k tokens)</text>
<text x="492" y="484" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">r_k = 128: stock K path (RoPE&#x27;d K straight into a full-width cache)</text>
<text x="492" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">r_v = 128: V block folded into the QKV weight, wo unchanged</text>
<text x="492" y="512" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">cache tag carries a converter version: ttnn&#x27;s weight cache keys on</text>
<text x="492" y="526" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5f6673">  name/shape/dtype only, never on content</text>
<text x="14" y="590" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5f6673" font-style="italic">Fig. R2. Every box is an existing ttnn op; the dashed block is Palu&#x27;s non-fused path and the whole of stage 2&#x27;s target.</text>
</svg>
